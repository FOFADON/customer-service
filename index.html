<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>鳳妃堂客服小助手</title>
<style>
:root{font-family:system-ui,"Noto Sans TC",sans-serif;color:#283747;background:#f3f6f9}*{box-sizing:border-box}body{margin:0}header{background:#183e61;color:white;padding:28px 20px}header>div{max-width:1080px;margin:auto}h1{margin:0 0 6px;font-size:1.6rem}p{line-height:1.6}.wrap{max-width:1080px;margin:20px auto;padding:0 15px}.cols{display:grid;grid-template-columns:1fr 1fr;gap:18px}.panel{background:white;border:1px solid #e0e6ec;border-radius:16px;padding:20px;box-shadow:0 3px 15px #00000008}.notice{background:#fff4d9;padding:12px 16px;border-radius:10px;margin-bottom:18px;font-size:.9rem}.steps{display:grid;grid-template-columns:1fr 1fr;gap:8px}.step{background:#f4f7fa;border:1px solid #d7e1e9;padding:11px;border-radius:10px;text-align:left;cursor:pointer;font-weight:600;color:#31465d}.step.active{background:#dcebf9;border-color:#28659b;color:#134d7b}label{display:block;font-weight:600;font-size:.9rem;margin:13px 0 6px}input,select,textarea{font:inherit;width:100%;border:1px solid #cbd6e1;border-radius:9px;padding:10px;background:white;color:#24384d}textarea{min-height:76px}button{cursor:pointer}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #84b9ee;outline-offset:2px}.btn{background:#205f94;color:white;border:0;border-radius:10px;padding:11px 15px;font:inherit;font-weight:600}.btn.secondary{background:#e9eff5;color:#235477}.btn:disabled{opacity:.45;cursor:not-allowed}.row{display:grid;grid-template-columns:1fr .6fr 1fr 32px;gap:6px;margin-bottom:8px}.row input{min-width:0}.summary{background:#eaf3fa;border-radius:12px;padding:12px;margin-top:12px}.sumline{display:flex;justify-content:space-between;gap:10px;margin:6px 0}.total{font-size:1.2rem;font-weight:800;border-top:1px solid #ccdae6;padding-top:9px}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:inherit;line-height:1.7;background:#f5f8fb;padding:15px;border-radius:12px;min-height:280px}small{color:#627487}.hidden{display:none}.tools{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}footer{text-align:center;color:#697d8e;padding:22px}@media(max-width:720px){.cols{grid-template-columns:1fr}.panel{padding:15px}}
</style></head><body><header><div><h1>鳳妃堂 · 客服小助手</h1><div>ERP 報價整理 · LINE 回覆 · 訂單與出貨流程</div></div></header><main class="wrap"><div class="notice">此為公開靜態網站。請勿輸入客戶電話、地址、完整銀行帳號等敏感資料。本工具不連線 ERP、不儲存訂單；報價請以 ERP 的「客戶實際報價金額」為準。</div><div class="cols"><section class="panel"><h2>① 客服流程</h2><div id="steps" class="steps"></div><label for="customer">客戶稱呼</label><input id="customer" value="馬老師"><div id="stock-box"><label for="stock">庫存狀態</label><select id="stock"><option value="all">全部有貨</option><option value="partial">部分缺貨</option><option value="none">全部缺貨</option></select></div><div id="order-box"><h2>② ERP 客戶報價</h2><small>輸入每項商品在 ERP 顯示的客戶實際報價小計；不要重新套用折數。</small><div id="items"></div><button class="btn secondary" id="add" type="button">＋ 新增商品</button><div class="summary"><div class="sumline"><span>商品報價合計</span><strong id="subtotal"></strong></div><div class="sumline"><span>運費</span><strong id="fee"></strong></div><div class="sumline total"><span>應付總額</span><strong id="total"></strong></div><small id="gap"></small></div></div><div id="payment-box"><label for="payment">匯款狀態</label><select id="payment"><option value="pending">尚未核實入帳</option><option value="received">已核實入帳</option></select></div><div id="dispatch-box"><label for="date">出貨日期</label><input id="date" placeholder="例如 2026/10/14"><label for="carrier">物流公司</label><input id="carrier"><label for="tracking">物流單號</label><input id="tracking"></div><label for="note">補充說明（選填）</label><textarea id="note" placeholder="例如：T101 目前台灣暫無販售"></textarea><details><summary>運費設定</summary><label for="threshold">免運門檻</label><input id="threshold" type="number" min="0" value="3000"><label for="shipping">未滿門檻運費</label><input id="shipping" type="number" min="0" value="150"><small>預設以 ERP 客戶實際報價商品金額判斷，特殊情況請依公司規則核對。</small></details></section><section class="panel"><h2>③ LINE 客服訊息預覽</h2><pre id="preview"></pre><label><input id="review" type="checkbox" style="width:auto"> 已人工確認 ERP 金額、庫存及訊息內容</label><div class="tools"><button id="copy" class="btn" disabled>複製 LINE 訊息</button><button id="reset" class="btn secondary">清除並重設</button></div><p id="status" role="status" aria-live="polite"></p><small>訊息不會自動傳送。匯款資料請由公司其他安全管道提供，避免放進公開程式碼。</small></section></div></main><footer>FOFADON · 客服小助手 v1.0</footer>
<script>
"use strict";
const $=id=>document.getElementById(id),stages=[["inquiry","01 客戶詢問"],["stock","02 庫存確認"],["quote","03 ERP 報價"],["confirm","04 訂單確認"],["remit","05 匯款通知"],["payment","06 款項確認"],["dispatch","07 出貨通知"],["support","08 售後服務"]];
let stage="inquiry",items=[{id:1,code:"602",qty:"6",amount:"2568"},{id:2,code:"201",qty:"2",amount:"536"}],next=3;
const number=v=>Number.isFinite(Number(v))?Math.max(0,Number(v)):0,fmt=v=>"NT$"+Math.round(v).toLocaleString("en-US");
function setStage(s){stage=s;$("review").checked=false;$("copy").disabled=true;render();}
function drawSteps(){const root=$("steps");root.replaceChildren();for(const [key,label] of stages){const b=document.createElement("button");b.className="step"+(stage===key?" active":"");b.textContent=label;b.type="button";b.setAttribute("aria-pressed",String(stage===key));b.onclick=()=>setStage(key);root.appendChild(b);}}
function drawItems(){const root=$("items");root.replaceChildren();for(const item of items){const r=document.createElement("div");r.className="row";for(const [key,label] of [["code","商品編號"],["qty","數量"],["amount","ERP 確認小計"]]){const inp=document.createElement("input");inp.type=key==="code"?"text":"number";if(inp.type==="number"){inp.min="0";inp.step=key==="qty"?"1":"0.01";}inp.value=item[key];inp.placeholder=label;inp.setAttribute("aria-label",label);inp.oninput=()=>{item[key]=inp.value;changed();};r.appendChild(inp);}const b=document.createElement("button");b.className="btn secondary";b.style.padding="5px";b.textContent="×";b.title="刪除商品";b.disabled=items.length===1;b.onclick=()=>{items=items.filter(x=>x.id!==item.id);drawItems();changed();};r.appendChild(b);root.appendChild(r);}}
function changed(){$("review").checked=false;$("copy").disabled=true;update();}
function update(){const name=$("customer").value.trim()||"您好",note=$("note").value.trim(),subtotal=items.reduce((s,x)=>s+number(x.amount),0),threshold=number($("threshold").value),fee=subtotal>=threshold?0:number($("shipping").value),total=subtotal+fee,details=items.filter(x=>x.code.trim()).map(x=>"・"+x.code.trim()+" × "+x.qty+"："+fmt(number(x.amount))).join("\n")||"【尚未輸入商品】",order="📦 訂購明細\n"+details+"\n\n商品合計："+fmt(subtotal)+"\n運費："+(fee?fmt(fee):"免運")+"\n應付總額："+fmt(total);
$("subtotal").textContent=fmt(subtotal);$("fee").textContent=fee?fmt(fee):"免運";$("total").textContent=fmt(total);$("gap").textContent=fee?"距免運還差 "+fmt(threshold-subtotal)+"，追加商品後需重新由 ERP 報價。":"已達免運門檻。";
let msg="";
switch(stage){
case "inquiry":msg="感謝您與鳳妃堂聯繫！\n\n想請問您目前想了解哪款產品呢？如有想訂購的商品，也歡迎提供產品編號及數量，我們會先為您確認庫存及價格。";break;
case "stock":msg=$("stock").value==="all"?"已幫您確認庫存，目前需要的商品皆有庫存，可以安排訂購。":$("stock").value==="partial"?"已幫您確認庫存，目前部分商品暫時缺貨，還請您見諒。":"很抱歉，目前您詢問的商品暫無庫存。";msg+=(note?"\n\n"+note:"")+"\n\n"+($("stock").value==="all"?"接下來會協助確認 ERP 訂購金額。":"請問是否需要調整訂購內容呢？");break;
case "quote":msg="已依 ERP 系統確認訂購金額：\n\n"+order+(fee?"\n\n目前尚未達免運門檻，如需追加商品，我們可以重新確認 ERP 金額。":"\n\n本次訂單享免運優惠！")+"\n\n再麻煩您確認商品及數量。";break;
case "confirm":msg="為您整理本次訂單：\n\n"+order+"\n\n再麻煩您確認商品、數量與金額是否正確，確認後我們會提供匯款資訊。";break;
case "remit":msg="感謝您的訂購！\n\n本次匯款金額："+fmt(total)+"\n\n匯款資訊將由本公司另行提供。完成匯款後，煩請提供帳號末五碼或匯款明細以便核對；確認實際入帳後會安排出貨。";break;
case "payment":msg=$("payment").value==="received"?"這邊已確認收到您的匯款，金額為 "+fmt(total)+"，接下來會安排出貨作業。":"已收到您的匯款通知，目前仍在核對款項，確認實際入帳後會再通知您。";break;
case "dispatch":msg="跟您通知一下，商品已安排寄出！\n\n📦 出貨資訊\n出貨日期："+($("date").value.trim()||"【待填】")+"\n物流公司："+($("carrier").value.trim()||"【待填】")+"\n物流單號："+($("tracking").value.trim()||"【待填】")+"\n\n寄出後預計約 2～4 天送達，實際以物流作業為準。";break;
case "support":msg=note||"想請問您收到商品後，有什麼需要我們協助的問題呢？我們會盡快為您確認處理。";break;
}
if(note&&!["stock","support"].includes(stage))msg+="\n\n"+note;
$("preview").textContent=name+"，您好！\n\n"+msg+"\n\n非常感謝您對鳳妃堂的支持與愛護！";
}
function render(){drawSteps();$("stock-box").classList.toggle("hidden",stage!=="stock");$("order-box").classList.toggle("hidden",!["quote","confirm","remit","payment"].includes(stage));$("payment-box").classList.toggle("hidden",stage!=="payment");$("dispatch-box").classList.toggle("hidden",stage!=="dispatch");update();}
for(const id of ["customer","stock","payment","date","carrier","tracking","note","threshold","shipping"])$(id).addEventListener("input",changed);
$("add").onclick=()=>{items.push({id:next++,code:"",qty:"1",amount:"0"});drawItems();changed();};
$("review").onchange=()=>{$("copy").disabled=!$("review").checked;};
$("copy").onclick=async()=>{try{await navigator.clipboard.writeText($("preview").textContent);$("status").textContent="已複製！貼到 LINE 前請再次確認。";}catch(e){$("status").textContent="無法自動複製，請手動選取預覽文字。";}};
$("reset").onclick=()=>{if(!confirm("確定清除目前資料並恢復範例？"))return;items=[{id:1,code:"602",qty:"6",amount:"2568"},{id:2,code:"201",qty:"2",amount:"536"}];next=3;for(const id of ["note","date","carrier","tracking"])$(id).value="";$("customer").value="馬老師";$("threshold").value="3000";$("shipping").value="150";$("stock").value="all";$("payment").value="pending";$("review").checked=false;$("copy").disabled=true;stage="inquiry";drawItems();render();};
drawItems();render();
</script></body></html>
